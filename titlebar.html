<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1f2025;
        color: #e4e4e7;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }

      #titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        background: #1f2025;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: drag;
      }

      .titlebar__left {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 12px;
      }

      .app-icon {
        width: 18px;
        height: 18px;
        -webkit-app-region: no-drag;
      }

      #window-title {
        font-size: 13px;
        font-weight: 500;
        color: #a1a1aa;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 300px;
      }

      .titlebar__right {
        display: flex;
        align-items: center;
        height: 100%;
        -webkit-app-region: no-drag;
      }

      .window-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 100%;
        background: transparent;
        border: none;
        color: #a1a1aa;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
        outline: none;
      }

      .window-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .window-btn.close-btn:hover {
        background: #e81123;
        color: #fff;
      }

      .window-btn svg {
        width: 10px;
        height: 10px;
      }

      /* Maximize/Restore icon toggle */
      .window-btn .icon-restore {
        display: none;
      }
      .window-btn.is-maximized .icon-max {
        display: none;
      }
      .window-btn.is-maximized .icon-restore {
        display: block;
      }

      /* macOS: hide custom buttons, show native traffic lights */
      .titlebar--macos .titlebar__right {
        display: none;
      }
      .titlebar--macos #window-title {
        display: none;
      }
      .titlebar--macos .app-icon {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="titlebar">
      <div class="titlebar__left">
        <img class="app-icon" src="public/nexus-logo.png" alt="NEXUS" onerror="this.style.display = 'none'" />
        <span id="window-title">NEXUS</span>
      </div>
      <div class="titlebar__right">
        <!-- Minimize -->
        <button class="window-btn" id="minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 1" fill="none">
            <line x1="0" y1="0.5" x2="10" y2="0.5" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <!-- Maximize / Restore -->
        <button class="window-btn" id="maximize" aria-label="Maximize">
          <svg class="icon-max" viewBox="0 0 10 10" fill="none">
            <rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none" />
          </svg>
          <svg class="icon-restore" viewBox="0 0 10 10" fill="none">
            <rect x="2.5" y="0.5" width="7" height="7" stroke="currentColor" stroke-width="1" fill="none" />
            <polyline points="0.5,2.5 0.5,9.5 7.5,9.5 7.5,7.5" stroke="currentColor" stroke-width="1" fill="none" />
          </svg>
        </button>
        <!-- Close -->
        <button class="window-btn close-btn" id="close" aria-label="Close">
          <svg viewBox="0 0 10 10" fill="none">
            <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2" />
            <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
