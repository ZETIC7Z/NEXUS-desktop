name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version tag (optional, uses run number if empty)'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npx vite build

      - name: Build Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npx vite build

      - name: Build macOS ${{ matrix.arch }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64]
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npx vite build

      - name: Build Linux ${{ matrix.arch }}
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.draft_release == 'true'
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release (if triggered manually)
        if: github.event.inputs.draft_release == 'true'
        run: |
          VERSION_TAG="${{ github.event.inputs.version }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="draft-${{ github.run_number }}"
          fi
          gh release create "$VERSION_TAG" \
            --title "Draft Release ${{ github.run_number }}" \
            --notes "Automated draft release" \
            --draft \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Release Assets
        run: |
          if [ "${{ github.event.inputs.draft_release }}" = "true" ]; then
            VERSION_TAG="${{ github.event.inputs.version }}"
            if [ -z "$VERSION_TAG" ]; then
              RELEASE_TAG="draft-${{ github.run_number }}"
            else
              RELEASE_TAG="$VERSION_TAG"
            fi
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          fi

          echo "Uploading to release: $RELEASE_TAG"

          for file in ./artifacts/*/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename..."
              gh release upload "$RELEASE_TAG" "$file" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
